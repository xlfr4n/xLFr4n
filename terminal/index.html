<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06080c"><meta name="description" content="Interactive xLFr4n terminal."><link rel="icon" href="../assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/xlfr4n.css"><title>xLFr4n // TERMINAL</title><style>.terminal-wrap{margin-top:34px;border:1px solid var(--line);background:#070a0f;box-shadow:var(--shadow);overflow:hidden}.termbar{display:flex;justify-content:space-between;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);background:#0b1017;color:var(--muted);font-size:11px}.termbar b{color:var(--red)}#out{min-height:430px;max-height:58vh;overflow:auto;padding:18px;white-space:pre-wrap;line-height:1.7;font-size:12px}.line-cmd{color:var(--red)}.line-out{color:#c2cad4}.line-muted{color:var(--muted)}.termform{display:flex;gap:9px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:#090d13}.termform span{color:var(--red)}#cmd{min-width:0;flex:1;border:0;background:transparent;color:var(--text);font:inherit;outline:none}#cmd::placeholder{color:#626c79}.termform button{border:1px solid rgba(255,51,68,.4);background:#0f1721;color:var(--red);padding:8px 11px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.quick button{border:1px solid var(--line);background:#0b1017;color:var(--muted);padding:6px 8px;font:inherit;font-size:10px;cursor:pointer}.quick button:hover{border-color:rgba(255,51,68,.4);color:var(--text)}.cursor{display:inline-block;width:7px;height:14px;background:var(--red);vertical-align:-2px;animation:blink 1s steps(2,start) infinite}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.cursor{animation:none;opacity:1}}</style></head><body><div class="shell"><header class="nav"><a class="brand" href="../"><span class="sig">⚡</span> xLFr4n // TERMINAL</a><nav class="navlinks" aria-label="Primary"><a href="../">LAB</a><a href="../status/">STATUS</a><a href="../play/">PLAY</a><a href="https://github.com/xlfr4n">GITHUB ↗</a></nav></header><main><section class="terminal-wrap"><div class="termbar"><span><b>xLFr4n@lab</b>:~$ interactive shell</span><span id="state">READY</span></div><div id="out" class="notranslate" aria-live="polite"></div><form class="termform" id="termform" autocomplete="off"><span>$</span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type help or explore..." aria-label="Terminal command"><button type="submit">RUN</button></form></section><div class="quick" aria-label="Quick commands"><button data-cmd="help">help</button><button data-cmd="neofetch">neofetch</button><button data-cmd="labs">labs</button><button data-cmd="projects">projects</button><button data-cmd="stack">stack</button><button data-cmd="status">status</button><button data-cmd="play">play</button><button data-cmd="clear">clear</button></div><p class="prose"><strong>Tip:</strong> use ↑/↓ for history, TAB for completion, <strong>open NAME</strong> for a repository and <strong>secret</strong> → <strong>x</strong> for the hidden layer.</p></main><footer class="footer"><span><span class="sig">⚡</span> xLFr4n</span><span>There is always another layer.</span><span data-year>2026</span></footer></div><script src="../assets/xlfr4n.js"></script><script>
const out=document.querySelector("#out"),input=document.querySelector("#cmd"),form=document.querySelector("#termform"),state=document.querySelector("#state");
const commands={help:["commands:","  about       identity + mission","  whoami      who is xLFr4n","  neofetch    compact lab profile","  labs        laboratory map","  projects    repository list","  stack       core technologies","  status      open public status","  play        launch MICRODOOM","  github      open GitHub profile","  open NAME   open a known repository","  pwd         current virtual path","  ls          virtual directory","  echo TEXT   print text","  date        current browser date","  clear       clear terminal","  secret      reveal first layer","  x           continue hidden path"],about:["xLFr4n // personal technical laboratory","","Build → Understand → Verify → Automate → Document.","Evidence over assumptions. Reproducibility over magic."],whoami:["xLFr4n","software · Linux · security · forensics · Web3 · automation"],neofetch:["       ⚡ xLFr4n","       --------------------------------","       OS        GitHub Pages","       SHELL     xLFr4n-web","       MODE      BUILD / VERIFY","       FOCUS     systems · forensics · full-stack","                 web3 · automation · experiments"],labs:["SYSTEMS        xLFr4n-Kali-BSPWM","OSINT          xLFr4n-OSINT","DATA           xLFr4n-Habbo-Furni-Radar","PRIVATE        xLFr4n-Desencryp","PRIVATE        xLFr4n-DevsAI","PRIVATE        xLFr4n-Habbo-Portfolio","PLAYGROUND     MICRODOOM"],projects:["xLFr4n-Kali-BSPWM","xLFr4n-OSINT","xLFr4n-Habbo-Furni-Radar"],stack:["Linux · Bash · Python · TypeScript · JavaScript","React · Next.js · Supabase · Git · GitHub · Docker","Web3 · Ethereum · Immutable"],status:["STATUS → ../status/"],play:["MICRODOOM → ../play/"],github:["GitHub → https://github.com/xlfr4n"],pwd:["/home/xLFr4n/lab"],ls:["README.md  BRAND.md  index.html","status/    terminal/   play/     assets/"],date:[new Date().toString()],secret:["[ REDACTED ]","","First layer unlocked.","Try: x"]};
const links={"xlfr4n-kali-bspwm":"https://github.com/xlfr4n/xLFr4n-Kali-BSPWM","xlfr4n-osint":"https://github.com/xlfr4n/xLFr4n-OSINT","xlfr4n-habbo-furni-radar":"https://github.com/xlfr4n/xLFr4n-Habbo-Furni-Radar"};
const history=[];let hi=-1;
function print(text,cls="line-out"){const d=document.createElement("div");d.className=cls;d.textContent=text;out.appendChild(d);out.scrollTop=out.scrollHeight}
function boot(){print("xLFr4n personal lab terminal");print("type help to explore · TAB completes commands","line-muted");print("");}
function run(raw){const c=raw.trim();if(!c)return;print("$ "+c,"line-cmd");history.push(c);hi=history.length;const low=c.toLowerCase();if(low==="clear"){out.innerHTML="";state.textContent="READY";return}if(low==="x"){print("⚡ XLFR4N // THERE IS ALWAYS ANOTHER LAYER.");print("you reached it. there may be another.");print("");return}if(low==="secret"){commands.secret.forEach(v=>print(v));print("");return}if(low.startsWith("echo ")){print(c.slice(5));print("");return}if(low.startsWith("open ")){const name=low.slice(5).trim();const url=links[name];if(url){window.open(url,"_blank","noopener");print("opening → "+url)}else print("unknown repository — try: projects");print("");return}if(commands[low]){commands[low].forEach(v=>print(v));if(low==="status")location.href="../status/";if(low==="play")location.href="../play/";if(low==="github")window.open("https://github.com/xlfr4n","_blank","noopener");print("");return}print("command not found — type help");print("");state.textContent="UNKNOWN";setTimeout(()=>state.textContent="READY",700)}
form.addEventListener("submit",e=>{e.preventDefault();run(input.value);input.value=""});document.querySelectorAll("[data-cmd]").forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.cmd;input.focus();form.requestSubmit()}));input.addEventListener("keydown",e=>{if(e.key==="ArrowUp"){e.preventDefault();hi=Math.max(0,hi-1);input.value=history[hi]||""}if(e.key==="ArrowDown"){e.preventDefault();hi=Math.min(history.length,hi+1);input.value=history[hi]||""}if(e.key==="Tab"){e.preventDefault();const q=input.value.toLowerCase();const all=[...Object.keys(commands),"clear"];const hit=all.find(k=>k.startsWith(q)&&k!==q);if(hit)input.value=hit}});boot();
</script></body></html>
