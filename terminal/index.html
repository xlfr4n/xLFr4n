><span><b>xlfr4n@lab</b>:~$ interactive shell</span><span id="state">READY</span></div><div id="out" aria-live="polite"></div><form class="termform" id="termform"><span>$</span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type help or explore..." aria-label="Terminal command"><button type="submit">RUN</button></form></section><div class="quick" aria-label="Quick commands"><button data-cmd="help">help</button><button data-cmd="whoami">whoami</button><button data-cmd="labs">labs</button><button data-cmd="projects">projects</button><button data-cmd="status">status</button><button data-cmd="play">play</button><button data-cmd="clear">clear</button></div><p class="prose"><strong>Tip:</strong> use ↑/↓ for history, TAB for command completion and <strong>x</strong> after <strong>secret</strong>.</p></main><footer class="footer"><span><span class="sig">⚡</span> xlfr4n</span><span>There is always another layer.</span><span data-year>2026</span></footer></div><script src="../assets/xlfr4n.js"></script><script>const out=document.querySelector("#out"),input=document.querySelector("#cmd"),form=document.querySelector("#termform"),state=document.querySelector("#state");const commands={help:["commands:","  about      identity + mission","  whoami     who is xlfr4n","  labs       laboratory map","  projects   repository list","  stack      core technologies","  status     open public status","  play       launch MICRODOOM","  github     open GitHub profile","  open NAME  open a known repository","  clear      clear terminal","  secret     reveal the first layer","  x          continue the hidden path"],about:["xlfr4n // personal technical laboratory","","Build → Understand → Verify → Automate → Document.","Evidence over assumptions. Reproducibility over magic."],whoami:["xlfr4n","software · Linux · security · forensics · Web3 · automation"],labs:["SYSTEMS        Kali BSPWM 2026","FORENSICS      desencryp","FULL-STACK     DevsAI","WEB3           HabboPortfolioPro","PLAYGROUND     MICRODOOM"],projects:["kali-bspwm-2026","desencryp","DevsAI","HabboPortfolioPro","habbo-furni-radar"],stack:["Linux · Bash · Python · TypeScript · JavaScript","React · Next.js · Supabase · Git · GitHub · Docker","Web3 · Ethereum · Immutable"],status:["STATUS → ../status/"],play:["MICRODOOM → ../play/"],github:["GitHub → https://github.com/xlfr4n"],secret:["[ REDACTED ]","","First layer unlocked.","Try: x"]};const links={"kali-bspwm-2026":"https://github.com/xlfr4n/kali-bspwm-2026","desencryp":"https://github.com/xlfr4n/desencryp","devsai":"https://github.com/xlfr4n/DevsAI","habboportfoliopro":"https://github.com/xlfr4n/HabboPortfolioPro","habbo-furni-radar":"https://github.com/xlfr4n/habbo-furni-radar"};const history=[];let hi=-1;function print(text,cls="line-out"){const d=document.createElement("div");d.className=cls;d.textContent=text;out.appendChild(d);out.scrollTop=out.scrollHeight}function boot(){print("xlfr4n personal lab terminal");print("type help to explore · TAB completes commands","line-muted");print("")}function run(raw){const c=raw.trim();if(!c)return;print("$ "+c,"line-cmd");history.push(c);hi=history.length;const low=c.toLowerCase();if(low==="clear"){out.innerHTML="";return}if(low==="x"){print("⚡ XLFR4N // THERE IS ALWAYS ANOTHER LAYER.");print("");return}if(low==="secret"){commands.secret.forEach(v=>print(v));print("");return}if(low.startsWith("open ")){const name=low.slice(5).trim();const url=links[name];if(url){window.open(url,"_blank","noopener");print("opening → "+url)}else print("unknown repository — try: projects");print("");return}if(commands[low]){commands[low].forEach(v=>print(v));if(low==="status")location.href="../status/";if(low==="play")location.href="../play/";if(low==="github")window.open("https://github.com/xlfr4n","_blank","noopener");print("");return}print("command not found — type help");print("");state.textContent="UNKNOWN";setTimeout(()=>state.textContent="READY",700)}form.addEventListener("
