name: MICRODOOM

on:
  push:
    branches:
      - feat/microdoom-complete-core
  pull_request:
    paths:
      - play/**
      - tests/microdoom-static.mjs
      - .github/workflows/microdoom.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check play/microdoom.js
      - name: Static gameplay smoke
        run: node tests/microdoom-static.mjs
      - name: HTML engine wiring
        run: |
          grep -Fq '<script src="./microdoom.js"></script>' play/index.html
          ! grep -Fq '<script src="./microdoom.js"></script><script>' play/index.html
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: node tests/microdoom-browser.mjs