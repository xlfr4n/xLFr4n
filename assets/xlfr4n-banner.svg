<text x="110" y="230" fill="#F5F7FA" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="112" font-weight="800" letter-spacing="-4">xlfr4n</text>
<text x="116" y="284" fill="#FF3344" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700">CYBERSECURITY · FULL-STACK · LINUX · WEB3</text>
<text x="116" y="326" fill="#9CA7B5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">investigate → build → verify → automate → document</text>
<rect x="116" y="354" width="565" height="3" fill="url(#sig)" filter="url(#glow)"/>
<text x="116" y="393" fill="#667180" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">[ systems ] [ forensics ] [ automation ] [ experiments ]</text>
<path d="M0 422H1600" stroke="#202733"/>
<path d="M0 422H620" stroke="#FF3344" stroke-width="5"/>
<text x="1510" y="448" text-anchor="end" fill="#FF3344" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" letter-spacing="3">⚡ XLFR4N</text>
</svg>