<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
<title id="title">xlfr4n — personal technical laboratory</title>
<desc id="desc">Cyber-red technical laboratory banner for xlfr4n.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06080C"/>
    <stop offset=".58" stop-color="#0B1017"/>
    <stop offset="1" stop-color="#1B0A10"/>
  </linearGradient>
  <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF3344"/>
    <stop offset="1" stop-color="#FF6875"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#26303D" stroke-width="1" opacity=".44"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1600" height="460" fill="url(#bg)"/>
<rect width="1600" height="460" fill="url(#grid)"/>
<rect x="72" y="68" width="9" height="270" fill="#FF3344" opacity=".85"/>
