<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>xlfr4n // MICRODOOM</title><style>:root{--red:#ff3344;--bg:#07090d;--fg:#f4f6f8}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}body{display:grid;place-items:center}main{width:min(1100px,100vw);padding:12px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}b{color:var(--red)}small{opacity:.65}#wrap{position:relative;border:1px solid #2b3039;box-shadow:0 0 30px #ff334422;background:#000}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}#hud{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;text-shadow:0 2px #000}#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#07090ddd;border:1px solid var(--red);padding:18px;pointer-events:none}#touch{display:none;position:absolute;inset:auto 10px 10px;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,52px);gap:5px}.pad button,.fire{pointer-events:auto;background:#111822cc;color:#fff;border:1px solid #ff334488;border-radius:8px;height:52px;font:inherit}.pad button:nth-child(1){grid-column:2}.fire{width:100px}@media(max-width:700px){main{padding:5px}header{font-size:12px}.pad{grid-template-columns:repeat(3,44px)}.pad button{height:44px}.fire{height:92px;width:82px}#touch{display:flex}}</style></head><body><main><header><strong>⚡ xlfr4n // <b>MICRODOOM</b></strong><small>WASD / arrows · SPACE fire · R restart</small></header><div id="wrap"><canvas id="c" width="960" height="540"></canvas><div id="hud"><span id="stats">HP 100 · AMMO 24 · KILLS 0</span><span>SECTOR 01</span></div><div id="msg">CLICK / TAP TO START<br><small>survive the red sector</small></div><div id="touch"><div class="pad"><button data-k="ArrowUp">▲</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div><button class="fire" data-k=" ">FIRE</button></div></div></main><script>const c=document.querySelector("#c"),x=c.getContext("2d"),W=c.width,H=c.height,keys={};let p,enemies,started=false,dead=false,last=0;const map=["111111111111","100000000001","101111011101","100001000001","111101011101","100001010001","101111010101","100000010001","101111110101","100000000001","111111111111"];function wall(a,b){return map[Math.floor(b)]?.[Math.floor(a)]!=="0"}function reset(){p={x:2.5,y:2.5,a:0,hp:100,ammo:24,kills:0};enemies=[{x:9.5,y:2.5,hp:3},{x:8.5,y:8.5,hp:3},{x:3.5,y:8.5,hp:3},{x:6.5,y:5.5,hp:3}];dead=false;started=true;document.querySelector("#msg").style.display="none"}function move(a,b){let nx=p.x+a,ny=p.y+b;if(!wall(nx,p.y))p.x=nx;if(!wall(p.x,ny))p.y=ny}function cast(a){let rx=Math.cos(a),ry=Math.sin(a),d=0;while(d<20){d+=.025;if(wall(p.x+rx*d,p.y+ry*d))return d}return 20}function shoot(){if(!started||dead||p.ammo<=0)return;p.ammo--;for(const e of enemies){let dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy),da=Math.atan2(dy,dx)-p.a;da=Math.atan2(Math.sin(da),Math.cos(da));if(e.hp>0&&Math.abs(da)<.07&&dist<cast(p.a)+.2){e.hp--;if(e.hp<=0)p.kills++}}}function update(dt){if(!started||dead)return;let sp=2.5*dt,turn=2.4*dt;if(keys.w||keys.ArrowUp)move(Math.cos(p.a)*sp,Math.sin(p.a)*sp);if(keys.s||keys.ArrowDown)move(-Math.cos(p.a)*sp,-Math.sin(p.a)*sp);if(keys.a)move(Math.cos(p.a-Math.PI/2)*sp,Math.sin(p.a-Math.PI/2)*sp);if(keys.d)move(Math.cos(p.a+Math.PI/2)*sp,Math.sin(p.a+Math.PI/2)*sp);if(keys.ArrowLeft)p.a-=turn;if(keys.ArrowRight)p.a+=turn;for(const e of enemies.filter(e=>e.hp>0)){let dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);if(dist<7){let step=.35*dt;e.x+=dx/dist*step;e.y+=dy/dist*step;if(dist<.7)p.hp-=12*dt}}if(p.hp<=0||enemies.every(e=>e.hp<=0))dead=true}function draw(){x.fillStyle="#080a0f";x.fillRect(0,0,W,H/2);x.fillStyle="#161016";x.fillRect(0,H/2,W,H/2);for(let i=0;i<160;i++){let a=p.a+(i/159-.5)*1.15,d=cast(a)*Math.cos(a-p.a),h=Math.min(H*1.8,H/(d+.01)),shade=Math.max(15,110-d*8);x.fillStyle="rgb("+(shade+40)+","+(shade/2)+","+(shade/2)+")";x.fillRect(i*6,H/2-h/2,7,h)}for(const e of enemies.filter(e=>e.hp>0)){let dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy),da=Math.atan2(dy,dx)-p.a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<.7){let sx=W/2+da/.7*(W/2),size=Math.min(180,H/dist*.55);x.fillStyle="#ff3344";x.fillRect(sx-size/2,H/2-size/2,size,size);x.fillStyle="#08090c";x.fillRect(sx-size*.22,H/2-size*.1,size*.12,size*.12);x.fillRect(sx+size*.1,H/2-size*.1,size*.12,size*.12)}}document.querySelector("#stats").textContent="HP "+Math.max(0,p.hp|0)+" · AMMO "+p.ammo+" · KILLS "+p.kills+"/"+enemies.length;if(dead){document.querySelector("#msg").innerHTML=p.kills===enemies.length?"SECTOR CLEARED<br><small>R to run it again</small>":"YOU DIED<br><small>R to restart</small>";document.querySelector("#msg").style.display="block"}}function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener("keydown",e=>{keys[e.key]=true;if(e.key===" "){e.preventDefault();shoot()}if(e.key.toLowerCase()==="r")reset()});addEventListener("keyup",e=>keys[e.key]=false);addEventListener("click",()=>{if(!started||dead)reset()});document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;b.addEventListener("touchstart",e=>{e.preventDefault();keys[k]=true;if(k===" ")shoot()},{passive:false});b.addEventListener("touchend",e=>{e.preventDefault();keys[k]=false},{passive:false})});</script></body></html>
